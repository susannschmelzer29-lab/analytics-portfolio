[project]
name = "careerpipe"
version = "0.1.0"
description = "Career pipeline: CV and LinkedIn texts with grounding and leak checks, weekly job research, bottlenecks and a learning loop"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
