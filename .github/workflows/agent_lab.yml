name: 10 agent lab

on:
  push:
    branches: [main]
    paths: ["10_agent_engineering_lab/**"]
  pull_request:
    paths: ["10_agent_engineering_lab/**"]
  workflow_dispatch:

defaults:
  run:
    working-directory: 10_agent_engineering_lab

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      # Its own step so the CI log shows at a glance whether the checks
      # still find their own known defects.
      - name: Canary
        run: |
          python - <<'PY'
          from agentlab.canary import verify_canary
          passed, missing = verify_canary()
          print("Canary:", "detected" if passed else f"MISSING {sorted(missing)}")
          raise SystemExit(0 if passed else 1)
          PY

      - name: Raw data unchanged
        run: |
          if [ -n "$(git status --porcelain data/raw)" ]; then
            echo "::error::data/raw was modified - not allowed."; exit 1
          fi
